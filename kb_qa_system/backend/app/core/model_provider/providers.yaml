# ============================================
# GeiIt企业知识库 - 模型服务配置文件
# ============================================
# 作用：定义文本/向量/多模态模型的主备端点，支持不同 API 提供商和本地部署
#
# 环境变量覆盖规则：
#   ${VAR}            - 取环境变量 VAR 的值（不存在则为空串）
#   ${VAR:default}    - 取环境变量 VAR 的值，不存在时用 default
#   ${VAR:${OTHER}}   - 嵌套引用：VAR 不存在时取 OTHER 的值
#
# 优先级（从高到低）：
#   1. 系统环境变量（部署平台注入）
#   2. .env 文件
#   3. YAML 中的 ${VAR:default} 默认值
#   4. YAML 字面值
#
# 每种能力的主备模型、API Key 与 API URL 均可独立设置。
# 新前缀为 MODEL_LANGUAGE_*, MODEL_EMBEDDING_*, MODEL_VISION_*；旧变量继续兼容。

# ============================================
# 全局默认参数（可被各 provider 覆盖）
# ============================================
defaults:
  timeout: 30
  max_retries: 3
  retry_base_delay: 1.0
  stream_first_token_timeout: 5
  circuit_breaker_threshold: 5
  circuit_breaker_recovery_time: 60

# ============================================
# 模型服务定义
# ============================================
# 每种 model_type 含一个有序列表：
#   [0] 为主模型（优先使用）
#   [1+] 为降级模型（主模型不可用时按序尝试）
# 路由器按顺序选择第一个熔断器未打开的端点。
providers:

  # ===== 文本 LLM 模型 =====
  llm:
    # 主模型
    - name: "primary"
      type: openai
      model: "${MODEL_LANGUAGE_PRIMARY_MODEL:${ALIYUN_LLM_MODEL:${LLM_MODEL_NAME:gpt-3.5-turbo}}}"
      api_key: "${MODEL_LANGUAGE_PRIMARY_API_KEY:${ALIYUN_API_KEY:${OPENAI_API_KEY}}}"
      api_base: "${MODEL_LANGUAGE_PRIMARY_API_URL:${ALIYUN_API_BASE:${OPENAI_API_BASE:https://api.openai.com/v1}}}"
      temperature: 0.1
      timeout: "${LLM_TIMEOUT:30}"
      max_retries: "${LLM_MAX_RETRIES:3}"
      retry_base_delay: "${LLM_RETRY_BASE_DELAY:1.0}"
      stream_first_token_timeout: "${LLM_STREAM_FIRST_TOKEN_TIMEOUT:5}"
      enabled: true
      health_check:
        enabled: true
        interval: 60
        timeout: 10
      tags: ["primary", "cloud"]

    # 降级模型（支持独立 API 配置，不设置则复用主 API）
    - name: "fallback"
      type: openai
      model: "${MODEL_LANGUAGE_FALLBACK_MODEL:${DEEPSEEK_LLM_MODEL:${LLM_FALLBACK_MODEL_NAME:gpt-3.5-turbo}}}"
      api_key: "${MODEL_LANGUAGE_FALLBACK_API_KEY:${DEEPSEEK_API_KEY:${LLM_FALLBACK_API_KEY:${OPENAI_API_KEY}}}}"
      api_base: "${MODEL_LANGUAGE_FALLBACK_API_URL:${DEEPSEEK_API_BASE:${LLM_FALLBACK_API_BASE:${OPENAI_API_BASE}}}}"
      temperature: 0.1
      timeout: "${LLM_TIMEOUT:30}"
      max_retries: 1
      retry_base_delay: "${LLM_RETRY_BASE_DELAY:1.0}"
      stream_first_token_timeout: "${LLM_STREAM_FIRST_TOKEN_TIMEOUT:5}"
      enabled: "${MODEL_LANGUAGE_FALLBACK_ENABLED:${DEEPSEEK_LLM_ENABLED:${LLM_FALLBACK_ENABLED:false}}}"
      health_check:
        enabled: true
        interval: 60
        timeout: 10
      tags: ["fallback", "cloud"]

    # 可选：本地 LLM 兜底（如 Ollama），默认关闭
    - name: "local_fallback"
      type: local_ollama
      model: "${LOCAL_LLM_MODEL:qwen2.5:7b}"
      api_base: "${LOCAL_LLM_BASE:http://localhost:11434/v1}"
      api_key: "ollama"
      temperature: 0.1
      timeout: 60
      max_retries: 1
      enabled: "${LOCAL_LLM_ENABLED:false}"
      health_check:
        enabled: false
      tags: ["fallback", "local"]

  # ===== Embedding 向量模型 =====
  embedding:
    # 主模型（在线 API）
    # Fallback vectors remain in their own model space. Reprocess documents when
    # changing model/endpoint; equal dimensions do not imply compatible vectors.
    - name: "primary"
      type: openai
      model: "${MODEL_EMBEDDING_PRIMARY_MODEL:${ALIYUN_EMBEDDING_MODEL:${EMBEDDING_MODEL_NAME:text-embedding-ada-002}}}"
      api_key: "${MODEL_EMBEDDING_PRIMARY_API_KEY:${ALIYUN_API_KEY:${OPENAI_API_KEY}}}"
      api_base: "${MODEL_EMBEDDING_PRIMARY_API_URL:${ALIYUN_API_BASE:${OPENAI_API_BASE:https://api.openai.com/v1}}}"
      dimension: "${MODEL_EMBEDDING_PRIMARY_DIMENSION:${EMBEDDING_DIMENSION:1536}}"
      vector_space_id: "${MODEL_EMBEDDING_PRIMARY_VECTOR_SPACE:}"
      supports_dimensions: "${MODEL_EMBEDDING_PRIMARY_SUPPORTS_DIMENSIONS:${EMBEDDING_SUPPORTS_DIMENSIONS:false}}"
      timeout: "${EMBEDDING_TIMEOUT:15}"
      max_retries: 2
      enabled: true
      health_check:
        enabled: true
        interval: 60
        timeout: 10
      tags: ["primary", "cloud"]

    # Optional separate embedding fallback. It must use the same model space
    # and dimension as the primary endpoint; never reuse the DeepSeek LLM endpoint.
    - name: "cloud_fallback"
      type: openai
      model: "${MODEL_EMBEDDING_FALLBACK_MODEL:${EMBEDDING_FALLBACK_MODEL_NAME:}}"
      api_key: "${MODEL_EMBEDDING_FALLBACK_API_KEY:${EMBEDDING_FALLBACK_API_KEY:}}"
      api_base: "${MODEL_EMBEDDING_FALLBACK_API_URL:${EMBEDDING_FALLBACK_API_BASE:}}"
      dimension: "${MODEL_EMBEDDING_FALLBACK_DIMENSION:${MODEL_EMBEDDING_PRIMARY_DIMENSION:${EMBEDDING_DIMENSION:1536}}}"
      vector_space_id: "${MODEL_EMBEDDING_FALLBACK_VECTOR_SPACE:}"
      supports_dimensions: "${MODEL_EMBEDDING_FALLBACK_SUPPORTS_DIMENSIONS:${EMBEDDING_FALLBACK_SUPPORTS_DIMENSIONS:false}}"
      timeout: "${EMBEDDING_TIMEOUT:15}"
      max_retries: 2
      enabled: "${MODEL_EMBEDDING_FALLBACK_ENABLED:${EMBEDDING_FALLBACK_ENABLED:false}}"
      health_check:
        enabled: true
        interval: 60
        timeout: 10
      tags: ["fallback", "cloud"]

    # Optional server-hosted fallback. Disabled by default; only enable after
    # confirming its output dimension matches the database vector column.
    - name: "local_fallback"
      type: local_hf
      model: "${LOCAL_EMBEDDING_MODEL:BAAI/bge-small-zh-v1.1}"
      dimension: 512
      timeout: 30
      max_retries: 1
      enabled: "${LOCAL_EMBEDDING_ENABLED:false}"
      health_check:
        enabled: false
      tags: ["fallback", "local"]

  # ===== Vision 多模态模型 =====
  vision:
    # 主模型
    - name: "primary"
      type: openai
      model: "${MODEL_VISION_PRIMARY_MODEL:${ALIYUN_VISION_MODEL:}}"
      api_key: "${MODEL_VISION_PRIMARY_API_KEY:${ALIYUN_API_KEY:${OPENAI_API_KEY}}}"
      api_base: "${MODEL_VISION_PRIMARY_API_URL:${ALIYUN_API_BASE:${OPENAI_API_BASE:https://api.openai.com/v1}}}"
      timeout: 30
      max_retries: 2
      max_tokens: 500
      temperature: 0.3
      enabled: "${MODEL_VISION_PRIMARY_ENABLED:${ALIYUN_VISION_ENABLED:false}}"
      health_check:
        enabled: true
        interval: 120
        timeout: 15
      tags: ["primary", "cloud"]

    # 可选：降级 Vision API
    - name: "fallback"
      type: openai
      model: "${MODEL_VISION_FALLBACK_MODEL:${VISION_FALLBACK_MODEL:gpt-4o-mini}}"
      api_key: "${MODEL_VISION_FALLBACK_API_KEY:${VISION_FALLBACK_API_KEY:${OPENAI_API_KEY}}}"
      api_base: "${MODEL_VISION_FALLBACK_API_URL:${VISION_FALLBACK_API_BASE:${OPENAI_API_BASE}}}"
      timeout: 30
      max_retries: 1
      max_tokens: 500
      temperature: 0.3
      enabled: "${MODEL_VISION_FALLBACK_ENABLED:${VISION_FALLBACK_ENABLED:false}}"
      health_check:
        enabled: false
      tags: ["fallback", "cloud"]

  # Rerank and image-generation secrets stay on the server.
  reranker:
    - name: "primary"
      type: dashscope_rerank
      model: "${MODEL_RERANK_PRIMARY_MODEL:qwen3.7-text-rerank}"
      api_key: "${MODEL_RERANK_PRIMARY_API_KEY:${ALIYUN_API_KEY:}}"
      api_base: "${MODEL_RERANK_PRIMARY_API_URL:${ALIYUN_API_BASE:}}"
      enabled: "${MODEL_RERANK_PRIMARY_ENABLED:true}"
      timeout: 8
      max_retries: 0
      health_check: { enabled: false }
      tags: ["primary", "cloud"]
    - name: "fallback"
      type: dashscope_rerank
      model: "${MODEL_RERANK_FALLBACK_MODEL:}"
      api_key: "${MODEL_RERANK_FALLBACK_API_KEY:}"
      api_base: "${MODEL_RERANK_FALLBACK_API_URL:}"
      enabled: "${MODEL_RERANK_FALLBACK_ENABLED:false}"
      timeout: 8
      max_retries: 0
      health_check: { enabled: false }
      tags: ["fallback", "cloud"]

  image_generation:
    - name: "primary"
      type: openai_images
      model: "${MODEL_IMAGE_GENERATION_PRIMARY_MODEL:}"
      api_key: "${MODEL_IMAGE_GENERATION_PRIMARY_API_KEY:}"
      api_base: "${MODEL_IMAGE_GENERATION_PRIMARY_API_URL:}"
      enabled: "${MODEL_IMAGE_GENERATION_PRIMARY_ENABLED:false}"
      timeout: 60
      max_retries: 0
      health_check: { enabled: false }
      tags: ["primary", "cloud"]
    - name: "fallback"
      type: openai_images
      model: "${MODEL_IMAGE_GENERATION_FALLBACK_MODEL:}"
      api_key: "${MODEL_IMAGE_GENERATION_FALLBACK_API_KEY:}"
      api_base: "${MODEL_IMAGE_GENERATION_FALLBACK_API_URL:}"
      enabled: "${MODEL_IMAGE_GENERATION_FALLBACK_ENABLED:false}"
      timeout: 60
      max_retries: 0
      health_check: { enabled: false }
      tags: ["fallback", "cloud"]
