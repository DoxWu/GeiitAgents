# ============================================
# GeiIt企业知识库 - 模型服务配置文件
# ============================================
# 作用：定义文本/向量/多模态模型的主备端点，支持不同 API 提供商和本地部署
#
# 环境变量覆盖规则：
#   ${VAR}            - 取环境变量 VAR 的值（不存在则为空串）
#   ${VAR:default}    - 取环境变量 VAR 的值，不存在时用 default
#   ${VAR:${OTHER}}   - 嵌套引用：VAR 不存在时取 OTHER 的值
#
# 优先级（从高到低）：
#   1. 系统环境变量（部署平台注入）
#   2. .env 文件
#   3. YAML 中的 ${VAR:default} 默认值
#   4. YAML 字面值
#
# 兼容性说明：
#   ALIYUN_* 配置主 LLM 与 Embedding；DEEPSEEK_* 仅配置文本 LLM 备用。
#   未设置新变量时仍兼容旧的 OPENAI_* / LLM_FALLBACK_* 配置。

# ============================================
# 全局默认参数（可被各 provider 覆盖）
# ============================================
defaults:
  timeout: 30
  max_retries: 3
  retry_base_delay: 1.0
  stream_first_token_timeout: 5
  circuit_breaker_threshold: 5
  circuit_breaker_recovery_time: 60

# ============================================
# 模型服务定义
# ============================================
# 每种 model_type 含一个有序列表：
#   [0] 为主模型（优先使用）
#   [1+] 为降级模型（主模型不可用时按序尝试）
# 路由器按顺序选择第一个熔断器未打开的端点。
providers:

  # ===== 文本 LLM 模型 =====
  llm:
    # 主模型
    - name: "primary"
      type: openai
      model: "${ALIYUN_LLM_MODEL:${LLM_MODEL_NAME:gpt-3.5-turbo}}"
      api_key: "${ALIYUN_API_KEY:${OPENAI_API_KEY}}"
      api_base: "${ALIYUN_API_BASE:${OPENAI_API_BASE:https://api.openai.com/v1}}"
      temperature: 0.1
      timeout: "${LLM_TIMEOUT:30}"
      max_retries: "${LLM_MAX_RETRIES:3}"
      retry_base_delay: "${LLM_RETRY_BASE_DELAY:1.0}"
      stream_first_token_timeout: "${LLM_STREAM_FIRST_TOKEN_TIMEOUT:5}"
      enabled: true
      health_check:
        enabled: true
        interval: 60
        timeout: 10
      tags: ["primary", "cloud"]

    # 降级模型（支持独立 API 配置，不设置则复用主 API）
    - name: "fallback"
      type: openai
      model: "${DEEPSEEK_LLM_MODEL:${LLM_FALLBACK_MODEL_NAME:gpt-3.5-turbo}}"
      api_key: "${DEEPSEEK_API_KEY:${LLM_FALLBACK_API_KEY:${OPENAI_API_KEY}}}"
      api_base: "${DEEPSEEK_API_BASE:${LLM_FALLBACK_API_BASE:${OPENAI_API_BASE}}}"
      temperature: 0.1
      timeout: "${LLM_TIMEOUT:30}"
      max_retries: 1
      retry_base_delay: "${LLM_RETRY_BASE_DELAY:1.0}"
      stream_first_token_timeout: "${LLM_STREAM_FIRST_TOKEN_TIMEOUT:5}"
      enabled: "${DEEPSEEK_LLM_ENABLED:${LLM_FALLBACK_ENABLED:false}}"
      health_check:
        enabled: true
        interval: 60
        timeout: 10
      tags: ["fallback", "cloud"]

    # 可选：本地 LLM 兜底（如 Ollama），默认关闭
    - name: "local_fallback"
      type: local_ollama
      model: "${LOCAL_LLM_MODEL:qwen2.5:7b}"
      api_base: "${LOCAL_LLM_BASE:http://localhost:11434/v1}"
      api_key: "ollama"
      temperature: 0.1
      timeout: 60
      max_retries: 1
      enabled: "${LOCAL_LLM_ENABLED:false}"
      health_check:
        enabled: false
      tags: ["fallback", "local"]

  # ===== Embedding 向量模型 =====
  embedding:
    # 主模型（在线 API）
    # Fallback vectors remain in their own model space. Reprocess documents when
    # changing model/endpoint; equal dimensions do not imply compatible vectors.
    - name: "primary"
      type: openai
      model: "${ALIYUN_EMBEDDING_MODEL:${EMBEDDING_MODEL_NAME:text-embedding-ada-002}}"
      api_key: "${ALIYUN_API_KEY:${OPENAI_API_KEY}}"
      api_base: "${ALIYUN_API_BASE:${OPENAI_API_BASE:https://api.openai.com/v1}}"
      dimension: "${EMBEDDING_DIMENSION:1536}"
      supports_dimensions: "${EMBEDDING_SUPPORTS_DIMENSIONS:false}"
      timeout: "${EMBEDDING_TIMEOUT:15}"
      max_retries: 2
      enabled: true
      health_check:
        enabled: true
        interval: 60
        timeout: 10
      tags: ["primary", "cloud"]

    # Optional separate embedding fallback. It must use the same model space
    # and dimension as the primary endpoint; never reuse the DeepSeek LLM endpoint.
    - name: "cloud_fallback"
      type: openai
      model: "${EMBEDDING_FALLBACK_MODEL_NAME:}"
      api_key: "${EMBEDDING_FALLBACK_API_KEY:}"
      api_base: "${EMBEDDING_FALLBACK_API_BASE:}"
      dimension: "${EMBEDDING_DIMENSION:1536}"
      supports_dimensions: "${EMBEDDING_FALLBACK_SUPPORTS_DIMENSIONS:false}"
      timeout: "${EMBEDDING_TIMEOUT:15}"
      max_retries: 2
      enabled: "${EMBEDDING_FALLBACK_ENABLED:false}"
      health_check:
        enabled: true
        interval: 60
        timeout: 10
      tags: ["fallback", "cloud"]

    # Optional server-hosted fallback. Disabled by default; only enable after
    # confirming its output dimension matches the database vector column.
    - name: "local_fallback"
      type: local_hf
      model: "${LOCAL_EMBEDDING_MODEL:BAAI/bge-small-zh-v1.1}"
      dimension: 512
      timeout: 30
      max_retries: 1
      enabled: "${LOCAL_EMBEDDING_ENABLED:false}"
      health_check:
        enabled: false
      tags: ["fallback", "local"]

  # ===== Vision 多模态模型 =====
  vision:
    # 主模型
    - name: "primary"
      type: openai
      model: "${ALIYUN_VISION_MODEL:}"
      api_key: "${ALIYUN_API_KEY:${OPENAI_API_KEY}}"
      api_base: "${ALIYUN_API_BASE:${OPENAI_API_BASE:https://api.openai.com/v1}}"
      timeout: 30
      max_retries: 2
      max_tokens: 500
      temperature: 0.3
      enabled: "${ALIYUN_VISION_ENABLED:false}"
      health_check:
        enabled: true
        interval: 120
        timeout: 15
      tags: ["primary", "cloud"]

    # 可选：降级 Vision API
    - name: "fallback"
      type: openai
      model: "${VISION_FALLBACK_MODEL:gpt-4o-mini}"
      api_key: "${VISION_FALLBACK_API_KEY:${OPENAI_API_KEY}}"
      api_base: "${VISION_FALLBACK_API_BASE:${OPENAI_API_BASE}}"
      timeout: 30
      max_retries: 1
      max_tokens: 500
      temperature: 0.3
      enabled: "${VISION_FALLBACK_ENABLED:false}"
      health_check:
        enabled: false
      tags: ["fallback", "cloud"]
