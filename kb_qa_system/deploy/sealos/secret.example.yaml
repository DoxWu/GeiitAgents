apiVersion: v1
kind: Secret
metadata:
  name: geiit-backend-env
type: Opaque
stringData:
  # Copy this file to secret.yaml, replace every placeholder, and never commit secret.yaml.
  DATABASE_URL: postgresql+psycopg://USER:PASSWORD@kb-qa-postgres:5432/kb_qa
  REDIS_URL: redis://:PASSWORD@kb-qa-redis:6379/0
  CELERY_BROKER_URL: redis://:PASSWORD@kb-qa-redis:6379/1
  CELERY_RESULT_BACKEND: redis://:PASSWORD@kb-qa-redis:6379/2
  SECRET_KEY: REPLACE_WITH_RANDOM_32_PLUS_CHAR_SECRET
  CORS_ORIGINS: '["https://REPLACE_WITH_FRONTEND_DOMAIN"]'
  OPENAI_API_KEY: REPLACE_WITH_PROVIDER_KEY
  OPENAI_API_BASE: https://REPLACE_WITH_PROVIDER_BASE/v1
  LLM_MODEL_NAME: REPLACE_WITH_PROVIDER_MODEL
  EMBEDDING_MODEL_NAME: REPLACE_WITH_EMBEDDING_MODEL
  EMBEDDING_DIMENSION: "1536"
  EMAIL_ENABLED: "false"
  REMINDERS_ENABLED: "false"
  MIGRATE_ON_STARTUP: "true"
  DB_RECOVERY_ENABLED: "true"
  BOOTSTRAP_ADMIN_ENABLED: "false"
