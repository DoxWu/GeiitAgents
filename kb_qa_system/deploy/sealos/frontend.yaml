apiVersion: apps/v1
kind: Deployment
metadata:
  name: geiit-frontend
  labels:
    app.kubernetes.io/name: geiit-agents
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: geiit-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: geiit-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: geiit-frontend:REPLACE_ME
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "80"
            - name: BACKEND_URL
              value: http://geiit-api:8000
            - name: PUBLIC_CONTACT_EMAIL
              value: ""
            - name: PUBLIC_OPERATOR_NAME
              value: ""
            - name: PUBLIC_OPERATOR_LOCATION
              value: ""
            - name: PUBLIC_DATA_PROCESSING_REGION
              value: ""
            - name: PUBLIC_DATA_RETENTION_NOTICE
              value: ""
            - name: PUBLIC_CROSS_BORDER_NOTICE
              value: ""
            - name: PUBLIC_THIRD_PARTY_PROCESSING_NOTICE
              value: ""
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: geiit-frontend
  labels:
    app.kubernetes.io/name: geiit-agents
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: geiit-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
