# ============================================
# GeiIt企业知识库 - 监控栈（Prometheus + Grafana + Alertmanager + Loki + Promtail）
# ============================================
# 作用：
#     启动完整可观测性栈：
#     - Prometheus：指标采集
#     - Grafana：可视化面板（指标 + 日志统一查询）
#     - Alertmanager：告警通知
#     - Loki：日志聚合（E6-01，轻量级日志系统，只索引标签）
#     - Promtail：日志采集代理（从 Docker 容器收集日志发送到 Loki）
#     需与主 docker-compose.yml 一起使用（共享网络）。
#
# 使用方式：
#     启动监控栈：
#     docker compose --env-file monitoring/.env -f docker-compose.yml -f monitoring/docker-compose.monitoring.yml up -d
#
#     仅启动监控（需主服务已在运行）：
#     docker compose --env-file monitoring/.env --project-directory . -f monitoring/docker-compose.monitoring.yml up -d
#     （project-directory 必须与主 Compose 项目目录相同）
#
# 访问地址：
#     Prometheus:   http://localhost:9090
#     Grafana:      http://localhost:3001 (admin / GRAFANA_ADMIN_PASSWORD)
#     Alertmanager: http://localhost:9093
#     Loki:         http://localhost:3100 (API，无 UI)
#
# 前置准备：
#     1. 在 backend/.env 中设置 ENABLE_PROMETHEUS=true
#     2. 主服务（api）需暴露 /metrics 端点
#     3. 告警邮件通知需配置 SMTP_* 和 ALERT_EMAIL_* 环境变量（复用 Resend 配置）
#     4. Promtail 需挂载 Docker socket 和容器日志目录（已在 compose 中配置）
# ============================================

services:
  # --------------------------------------------
  # Prometheus 指标采集
  # --------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: kb_qa_prometheus
    restart: unless-stopped
    environment:
      PROMETHEUS_AUTH_USER: ${PROMETHEUS_AUTH_USER:-prometheus}
      PROMETHEUS_AUTH_PASSWORD: ${PROMETHEUS_AUTH_PASSWORD:-}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # Prometheus 配置和告警规则
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      # 数据持久化
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--config.expand-env"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    # 连接到主 docker-compose 的网络（确保能访问 api:8000）
    networks:
      - default

  # --------------------------------------------
  # Grafana 可视化面板
  # --------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    container_name: kb_qa_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # 数据源和面板自动配置
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # 数据持久化
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - default

  # --------------------------------------------
  # Alertmanager 告警通知（D8-01）
  # --------------------------------------------
  # 作用：接收 Prometheus 触发的告警，通过邮件通知管理员
  # 告警流程：Prometheus 检测异常 → 触发 alerts.yml 规则 →
  #           发送到 Alertmanager → 按路由分组 → 邮件通知管理员
  # SMTP 配置复用项目 Resend 邮件服务（通过环境变量注入）
  alertmanager:
    build:
      context: ./monitoring
      dockerfile: alertmanager/Dockerfile
    image: geiit/alertmanager-rendered:v0.28.1
    container_name: kb_qa_alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
      - alertmanager_data:/alertmanager
    # SMTP 配置通过监控专用环境文件注入；entrypoint renders a private config.
    # 作用：Alertmanager 读取这些变量替换 alertmanager.yml 中的 ${VAR} 占位符
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-admin@example.com}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-GeiIt企业知识库 <onboarding@resend.dev>}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      - prometheus
    networks:
      - default

  # --------------------------------------------
  # Loki 日志聚合（E6-01）
  # --------------------------------------------
  # 作用：接收 Promtail 推送的日志，建立标签索引供 Grafana 查询
  # 特点：只索引日志标签（metadata）不索引全文，存储成本远低于 ELK
  # 查询语言：LogQL（类似 PromQL，支持过滤、聚合、正则匹配）
  loki:
    image: grafana/loki:3.3.2
    container_name: kb_qa_loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      # Loki 配置文件
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      # 数据持久化（日志块、索引、压缩数据）
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    # 健康检查：Loki /ready 端点返回 200 表示就绪
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default

  # --------------------------------------------
  # Promtail 日志采集代理（E6-01）
  # --------------------------------------------
  # 作用：通过 Docker socket 自动发现容器，采集容器日志并发送到 Loki
  # 工作流程：监听 docker.sock → 发现 kb_qa_* 容器 → 读取 JSON 日志 → 解析标签 → 推送 Loki
  # 依赖：需挂载 /var/run/docker.sock 和 /var/lib/docker/containers
  promtail:
    image: grafana/promtail:3.3.2
    container_name: kb_qa_promtail
    restart: unless-stopped
    ports:
      - "127.0.0.1:9080:9080"  # Promtail target status
    volumes:
      # Promtail 配置文件
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      # Docker socket：用于容器自动发现
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 容器日志目录：Docker json-file 驱动日志存储位置
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # positions 文件持久化：记录日志读取位置，重启后不丢日志
      - promtail_data:/tmp
    command:
      - "-config.file=/etc/promtail/config.yml"
    depends_on:
      - loki
    networks:
      - default

# ============================================
# 持久化卷
# ============================================
volumes:
  prometheus_data:    # Prometheus 指标数据（30 天保留）
  grafana_data:       # Grafana 配置和用户数据
  loki_data:          # Loki 日志块和索引（7 天保留，由 loki-config.yml 配置）
  promtail_data:      # Promtail positions 文件（记录日志读取位置）
  alertmanager_data:  # Alertmanager silences and notification state

# ============================================
# 网络
# ============================================
# 使用 default 网络时，docker-compose 会自动将此文件的容器
# 加入主 docker-compose 的网络（通过项目名关联）。
# 如需手动指定，取消注释以下配置并替换为实际网络名。
# ============================================
# networks:
#   default:
#     external: true
#     name: kb_qa_system_default
