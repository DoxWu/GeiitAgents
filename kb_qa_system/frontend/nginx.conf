# ============================================
# GeiIt企业知识库 - nginx 配置（反代模式）
# ============================================
# 作用：
#     1. 提供前端静态资源服务
#     2. SPA 路由回退
#     3. 反向代理后端 API（消除 CORS 跨域问题）
#     4. 静态资源缓存优化
#     5. 安全头设置
#
# 变量替换：
#     ${BACKEND_URL} 在容器启动时由 start.sh 通过 envsubst 替换。
#     格式：https://your-backend.up.railway.app（含协议，不含尾部斜杠）
# ============================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/xml+rss
        application/xhtml+xml
        image/svg+xml;

    # --------------------------------------------
    # API 反向代理
    # --------------------------------------------
    # 作用：前端通过同源 /api/v1/... 访问后端，由 nginx 转发
    # 好处：
    #   1. 消除 CORS，浏览器无需 OPTIONS 预检
    #   2. 浏览器只访问前端域名，解决国产浏览器 fetch 兼容性
    #   3. 服务端转发比浏览器直连海外服务器更稳定
    #
    # 转发规则：
    #   /api/v1/auth/login → ${BACKEND_URL}/api/v1/auth/login
    #   proxy_pass 不带 URI（末尾无 /），nginx 原样传递完整原始 URI
    # --------------------------------------------
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式传输支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 文件上传大小限制
        client_max_body_size 50m;
    }

    location = /ws/notifications {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        # Ticket queries must not be stored in access logs.
        access_log off;
    }

    # Public readiness for off-provider monitoring; do not return SPA HTML.
    location = /ready {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # ONNX module/WASM MIME types must not depend on the image's mime.types version.
    location ~ ^/assets/.*\.(mjs|wasm)$ {
        types { application/javascript mjs; application/wasm wasm; }
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # 静态资源缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    location = /robots.txt {
        expires 1h;
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
        expires 0;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # 安全头设置
    include /etc/nginx/security-headers.conf;

    # Source maps are never served, even if copied by an alternate build.
    location ~ \.map$ { return 404; }
}
