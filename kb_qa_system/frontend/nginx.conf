# ============================================
# GeiIt企业知识库 - nginx 配置（反代模式）
# ============================================
# 作用：
#     1. 提供前端静态资源服务
#     2. SPA 路由回退
#     3. 反向代理后端 API（消除 CORS 跨域问题）
#     4. 静态资源缓存优化
#     5. 安全头设置
#
# 变量替换：
#     ${BACKEND_URL} 在容器启动时由 start.sh 通过 envsubst 替换。
#     格式：https://your-backend.up.railway.app（含协议，不含尾部斜杠）
# ============================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/xml+rss
        application/xhtml+xml
        image/svg+xml;

    # --------------------------------------------
    # API 反向代理
    # --------------------------------------------
    # 作用：前端通过同源 /api/v1/... 访问后端，由 nginx 转发
    # 好处：
    #   1. 消除 CORS，浏览器无需 OPTIONS 预检
    #   2. 浏览器只访问前端域名，解决国产浏览器 fetch 兼容性
    #   3. 服务端转发比浏览器直连海外服务器更稳定
    #
    # 转发规则：
    #   /api/v1/auth/login → ${BACKEND_URL}/api/v1/auth/login
    #   proxy_pass 不带 URI（末尾无 /），nginx 原样传递完整原始 URI
    # --------------------------------------------
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流式传输支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 文件上传大小限制
        client_max_body_size 50m;
    }

    # Public readiness for off-provider monitoring; do not return SPA HTML.
    location = /ready {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # ONNX module/WASM MIME types must not depend on the image's mime.types version.
    location ~ ^/assets/.*\.(mjs|wasm)$ {
        types { application/javascript mjs; application/wasm wasm; }
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /robots.txt {
        expires 1h;
        access_log off;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 安全头设置
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Local embeddings fetch only public model artifacts; business APIs remain same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.up.railway.app wss://*.up.railway.app https://huggingface.co https://*.huggingface.co https://*.hf.co; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; report-uri /api/csp-report" always;

    # 自定义错误页面
    error_page 404 /index.html;
}
