<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>网页预览</title>
</head>
<body><script>
// Runs only in the opaque preview sandbox with its independent response CSP.
(() => {
  if (window.parent === window) return;
  function render(event) {
    if (event.source !== window.parent || event.data?.type !== 'geiit-preview-render'
      || typeof event.data.html !== 'string' || event.data.html.length > 8_000_000) return;
    window.removeEventListener('message', render);
    document.open();
    document.write(event.data.html);
    document.close();
  }
  window.addEventListener('message', render);
  window.parent.postMessage({ type: 'geiit-preview-ready' }, '*');
})();
</script></body>
</html>
