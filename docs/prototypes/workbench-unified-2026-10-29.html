 $(`#${mode}-layers`).innerHTML=data.shapes.map((o,i)=>`<button class="${selected(o.id,data.selection)}" data-select-shape="${o.id}" data-target="${mode}">${String(i+1).padStart(2,'0')} ${esc(o.name)}</button>`).join('');}

ength?a.bindings.map(id=>{const r=resources.find(x=>x.id===id);return `<div class="bound-item"><div class="row between"><strong class="small">${esc(r.name)}</strong><button class="subtle small-btn" data-unbind="${r.id}" aria-label="移除 ${esc(r.name)}">×</button></div><div class="row" style="margin-top:7px"><span class="tag">${{tools:'工具',skills:'技能',mcp:'MCP'}[r.kind]}</span><span class="help">v${r.version}</span></div><p class="help" style="margin-top:8px">${r.detail}</p></div>`;}).join(''):'<p class="help">暂未绑定能力。</p>'}<div class="divider"></div><p class="help">工具负责动作，技能提供指令与资料，MCP 连接外部能力。资源更新后可审阅再升级。</p><button data-nav="resources" class="small-btn" style="margin-top:14px">管理资源仓库 →</button></div></section></div>`;}

 if(b.dataset.addShape){const mode=b.dataset.target||'image',list=canvasData(mode).shapes;if(list.length>=16){toast('每张画布最多 16 个区域。');return;}const type=b.dataset.addShape,o={id:'shape'+(++serial),name:type==='text'?'新文字区域':'新画面区域',type,x:20,y:30,w:30,h:25,color:type==='text'?'#344f38':'#c4bc9f',description:'',mode:type==='text'?'theme':'image'};list.push(o);if(mode==='image')state.imageSelection=o.id;else slides[state.slide].selection=o.id;render();return;}

 if(b.dataset.resourceDetail){const r=resources.find(r=>r.id===b.dataset.resourceDetail);modal(r.name,`<p>${esc(r.description)}</p><div class="divider"></div><p class="help">类别：${{tools:'工具',skills:'技能',mcp:'MCP'}[r.kind]}　·　范围：${r.scope}　·　版本：${r.version}</p><div class="note" style="margin-top:15px">${r.detail}</div><p class="help" style="margin-top:12px">${r.kind==='mcp'?'连接授权属于每位使用者，只有明确开放的工具才能被智能体调用。':'执行时按当前用户、组织成员关系与资源授权重新检查。'}</p>`,`<button data-action="close-modal">关闭</button><button class="primary" data-action="bind-from-resource" data-resource="${r.id}">加入当前智能体（演示）</button>`);return;}

 if(action==='run'){if(!state.nodes.length){toast('请先添加一个智能体步骤。');return;}state.run=true;state.runDone=0;render();const count=state.nodes.length;for(let i=0;i<count;i++){await new Promise(r=>setTimeout(r,450));state.runDone=i+1;if(state.page==='tasks')render();}state.run=false;if(state.page==='tasks')render();toast('模拟运行完成。没有调用模型或生成真实文件。');return;}
 if(action.startsWith('node-')){if(state.run)return;const i=state.nodes.findIndex(n=>n.id===state.selectedNode);if(i<0)return;if(action==='node-delete'){state.nodes.splice(i,1);state.selectedNode=state.nodes[0]?.id;}else{const j=i+(action==='node-up'?-1:1);if(j<0||j>=state.nodes.length)return;[state.nodes[i],state.nodes[j]]=[state.nodes[j],state.nodes[i]];}state.nodes.forEach((n,k)=>{const allowed=state.nodes.slice(0,k).map(v=>`${agentBy(v.agent).name}.${agentBy(v.agent).output}`);if(!allowed.includes(n.binding))n.binding='任务输入 · 参考材料';});state.runDone=0;render();return;}
 if(action==='add-slide'){if(slides.length>=12){toast('本样例最多 12 页。');return;}slides.push({title:'新页面',selection:'s'+(++serial),shapes:[]});state.slide=slides.length-1;render();return;}
 if(action==='slide-shape-delete'){const s=slides[state.slide];s.shapes=s.shapes.filter(o=>o.id!==s.selection);s.selection=s.shapes[0]?.id;render();return;}
 if(action==='document-spec'){showSpec('文档生成要求',documentSpec());return;}
 if(action==='document-generate'){modal('文档生成 · 流程演示',`<div class="note">目标格式：${state.format.toUpperCase()} · ${esc(defaults[state.format].title)}</div><div class="stack" style="margin-top:18px">${['确认内容与参考模板','按章节 / 页面 / 工作表生成结构','填充文字与图片，检查布局','导出原生文件并预览验收'].map((x,i)=>`<div class="row"><span class="step-index">${i+1}</span>${x}</div>`).join('')}</div><p class="help" style="margin-top:20px">此处只演示生成流程；没有调用模型、解析参考文档或输出 Office 文件。可以导出需求 JSON 留作讨论。</p>`,`<button data-action="close-modal">继续设计</button><button class="primary" data-action="download-document">导出需求 JSON</button>`);return;}
 if(action==='image-spec'){showSpec('图片构图说明',imageSpec());return;}
 if(action==='image-generate'){modal('图片生成 · 输入预览',`<p>${esc(state.prompt)}</p><div class="divider"></div><p class="help">画面比例 ${state.imageRatio.replace('/',':')} · ${state.shapes.length} 个描述区域 · ${state.refs.length} 张参考图片</p><div class="stack" style="margin-top:12px">${state.shapes.map((o,i)=>`<div class="note"><strong>${i+1}. ${esc(o.name)}</strong><br>${esc(o.description||'尚未填写区域说明')}</div>`).join('')}</div><p class="help" style="margin-top:16px">实施时会将构图和说明交给支持该能力的模型。此页只预览输入，没有生成图片。</p>`,`<button data-action="close-modal">继续构图</button><button class="primary" data-action="download-image">导出构图 JSON</button>`);return;}
 if(action==='download-document'){download('document-design.json',documentSpec());return;}
 if(action==='download-image'){download('image-composition.json',imageSpec());return;}
 if(action.startsWith('shape-')){const i=state.shapes.findIndex(o=>o.id===state.imageSelection);if(i<0)return;if(action==='shape-delete'){state.shapes.splice(i,1);state.imageSelection=state.shapes.at(-1)?.id;}if(action==='shape-copy'){if(state.shapes.length>=16){toast('每张画布最多 16 个区域。');return;}const o=state.shapes[i],copy={...o,id:'shape'+(++serial),name:o.name+' 副本',x:Math.min(100-o.w,o.x+4),y:Math.min(100-o.h,o.y+4)};state.shapes.push(copy);state.imageSelection=copy.id;}if(action==='shape-front')state.shapes.push(state.shapes.splice(i,1)[0]);render();return;}
 if(action==='new-agent'){const a={id:'agent'+(++serial),name:'新智能体',summary:'自定义角色与能力。',scope:'私有',icon:'agents',instructions:'请填写这个智能体应完成的任务、输出要求和工作边界。',bindings:[],output:'result'};agents.push(a);state.selectedAgent=a.id;render();return;}
 if(action==='save-agent'){toast('智能体草稿已保留在本页内存，刷新后重置。');render();return;}
 if(action==='bind'){const a=agentBy(state.selectedAgent);modal('为 '+a.name+' 添加能力',`<p class="help">选择可见资源。实际执行仍需检查独立授权。</p>${resources.map(r=>`<label class="check-row"><input type="checkbox" data-bind-check="${r.id}" ${a.bindings.includes(r.id)?'checked':''}><span>${esc(r.name)} <span class="tag">${{tools:'工具',skills:'技能',mcp:'MCP'}[r.kind]}</span><small>${r.scope} · v${r.version} · ${r.detail}</small></span></label>`).join('')}`,`<button data-action="close-modal">取消</button><button class="primary" data-action="confirm-bind">应用选择（演示）</button>`);return;}
 if(action==='confirm-bind'){agentBy(state.selectedAgent).bindings=$$('[data-bind-check]:checked').map(x=>x.dataset.bindCheck);$('#modal').close();render();toast('能力引用已更新。');return;}
 if(action==='bind-from-resource'){const a=agentBy(state.selectedAgent);if(!a.bindings.includes(b.dataset.resource))a.bindings.push(b.dataset.resource);$('#modal').close();toast('已加入「'+a.name+'」，可在智能体页查看。');return;}
 if(action==='new-resource'){modal('添加仓库资源',`<label style="margin-top:0" for="new-kind">资源类别</label><select id="new-kind"><option value="tools">工具 · 声明动作与输入输出</option><option value="skills">技能 · 指令、资料与示例</option><option value="mcp">MCP · 外部能力连接</option></select><label for="new-name">资源名称</label><input id="new-name" maxlength="80" placeholder="例如：团队文案检查"><label for="new-description">用途与说明</label><textarea id="new-description" placeholder="说明资源能做什么，以及需要哪些输入"></textarea><label for="new-scope">希望发布到</label><select id="new-scope"><option>私有</option><option>组织</option><option>共有</option></select><div class="note" style="margin-top:14px">此处展示创建草稿的交互。正式接入时，工具配置执行方式与字段，技能填写内容，MCP 配置连接与允许的工具；组织 / 共有发布进入审批。</div>`,`<button data-action="close-modal">取消</button><button class="primary" data-action="create-resource">创建草稿（演示）</button>`);return;}
 if(action==='create-resource'){const name=$('#new-name').value.trim();if(!name){$('#new-name').focus();toast('请填写资源名称。');return;}const scope=$('#new-scope').value;resources.push({id:'r'+(++serial),kind:$('#new-kind').value,name,description:$('#new-description').value||'待补充能力说明。',scope:'私有',version:'0.1',status:scope==='私有'?'草稿':'待发布审批',detail:scope==='私有'?'草稿 · 执行配置待完善':`申请发布到${scope} · 审批示例`});state.resourceKind='all';state.scope='all';state.search='';$('#modal').close();render();toast(scope==='私有'?'资源草稿已添加（仅本页）。':'已创建私有草稿并标记发布申请（模拟）。');return;}
});
function documentSpec(){const d=defaults[state.format];return {prototype:true,format:state.format,...d,pictures:d.pictures.map(r=>({id:r.id,name:r.name})),...(state.format==='pptx'?{slides}:{}),note:'本样例只记录需求，不解析模板或调用生成接口。'};}
function imageSpec(){return {prototype:true,prompt:state.prompt,connection:state.imageConnection,aspectRatio:state.imageRatio,referenceImages:state.refs.map(r=>({name:r.name})),coordinateUnit:'percent',regions:state.shapes,note:'图像与布局控制取决于模型能力。不得在不提示用户的情况下丢弃参考图。'};}
function showSpec(title,value){modal(title,`<p class="help">用于预览信息如何传递给后续生成流程，不包含连接凭据或参考文件正文。</p><pre>${esc(JSON.stringify(value,null,2))}</pre>`);}
function download(name,value){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出设计说明 JSON。');}
document.addEventListener('input',e=>{
 const t=e.target,f=t.dataset.field;
 if(t.id==='resource-search'){state.search=t.value;$('#resource-grid').innerHTML=resourceCards();return;}
 if(t.dataset.budget!==undefined){$('#budget-total').textContent=$$('[data-budget]').reduce((sum,x)=>sum+(Number(x.value)||0),0).toLocaleString('zh-CN');return;}
 if(t.dataset.geo){const o=state.shapes.find(x=>x.id===state.imageSelection);if(!o||t.value==='')return;const key=t.dataset.geo,min=key==='w'||key==='h'?6:0;const num=Number(t.value);if(!Number.isFinite(num))return;o[key]=Math.max(min,Math.min(100,num));o.w=Math.max(6,Math.min(100,o.w));o.h=Math.max(6,Math.min(100,o.h));o.x=Math.min(o.x,100-o.w);o.y=Math.min(o.y,100-o.h);paintCanvas('image');return;}
 if(!f)return;
 if(f.startsWith('node-')){const n=state.nodes.find(n=>n.id===state.selectedNode);if(n)n[{ 'node-title':'title','node-note':'note','node-binding':'binding'}[f]]=t.value;return;}
 if(f==='document-title'||f==='document-brief'){const d=defaults[state.format];d[f==='document-title'?'title':'brief']=t.value;const target=$(f==='document-title'?'#paper-title':'#paper-brief');if(target)target.textContent=t.value;if(f==='document-title'&&state.format==='pptx'){const o=slides[0].shapes.find(x=>x.type==='text');if(o){o.name=t.value;paintCanvas('slide');}}return;}
 if(f==='doc-mode'){defaults[state.format].mode=t.value;return;}
 if(f.startsWith('slide-')){const s=slides[state.slide],o=s.shapes.find(x=>x.id===s.selection);if(o)o[f.slice(6)]=t.value;paintCanvas('slide');return;}
 if(f==='image-prompt'){state.prompt=t.value;return;}
 if(f==='image-connection'){state.imageConnection=t.value;return;}
 if(f==='image-ratio'){state.imageRatio=t.value;$('#image-canvas').style.aspectRatio=t.value;return;}
 if(f.startsWith('shape-')){const o=state.shapes.find(x=>x.id===state.imageSelection);if(o)o[f.slice(6)]=t.value;paintCanvas('image');return;}
 if(f.startsWith('agent-')){const a=agentBy(state.selectedAgent);a[f.slice(6)]=t.value;return;}
});
document.addEventListener('change',async e=>{
 const t=e.target;if(t.id==='resource-scope'){state.scope=t.value;$('#resource-grid').innerHTML=resourceCards();return;}
 if(t.dataset.geo){selectShape('image',state.imageSelection);return;}
 if(t.dataset.field==='slide-mode'||t.dataset.field==='agent-scope'||t.dataset.field==='agent-name'||t.dataset.field==='node-title'||t.dataset.field==='shape-type'){render();return;}
 if(!t.dataset.upload)return;
 const files=[...t.files],kind=t.dataset.upload;
 if(kind==='document'){defaults[state.format].refs.push(...files.map(f=>f.name));render();toast('已添加参考文件名；此样例不读取文档正文。');return;}
 const destination=kind==='image'?state.refs:defaults[state.format].pictures;
 for(const file of files){if(destination.length>=6){toast('样例每处最多添加 6 张参考图片。');break;}if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024){toast('请选择 5 MB 以内的 PNG / JPEG / WebP 图片。');continue;}destination.push({id:'asset'+(++serial),name:file.name,url:URL.createObjectURL(file)});}
 render();
});
let drag=null;
document.addEventListener('pointerdown',e=>{
 const el=e.target.closest('[data-shape]');if(!el||e.button!==0)return;const mode=el.dataset.mode,objects=canvasData(mode),o=objects.shapes.find(v=>v.id===el.dataset.shape);selectShape(mode,o.id,false);$$('.shape',el.parentElement).forEach(x=>x.classList.toggle('selected',x.dataset.shape===o.id));
 drag={mode,o,el,resize:!!e.target.dataset.resize,startX:e.clientX,startY:e.clientY,original:{...o},rect:el.parentElement.getBoundingClientRect(),pointerId:e.pointerId};el.setPointerCapture(e.pointerId);el.focus({preventScroll:true});e.preventDefault();
});
document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointerId)return;const d=drag,dx=(e.clientX-d.startX)/d.rect.width*100,dy=(e.clientY-d.startY)/d.rect.height*100;if(d.resize){d.o.w=Math.max(6,Math.min(100-d.o.x,d.original.w+dx));d.o.h=Math.max(6,Math.min(100-d.o.y,d.original.h+dy));}else{d.o.x=Math.max(0,Math.min(100-d.o.w,d.original.x+dx));d.o.y=Math.max(0,Math.min(100-d.o.h,d.original.y+dy));}Object.assign(d.el.style,{left:d.o.x+'%',top:d.o.y+'%',width:d.o.w+'%',height:d.o.h+'%'});if(d.mode==='image')for(const k of ['x','y','w','h'])$('#geo-'+k).value=Math.round(d.o[k]);});
function finishDrag(){if(!drag)return;const d=drag;drag=null;selectShape(d.mode,d.o.id);$(`[data-shape="${d.o.id}"]`)?.focus({preventScroll:true});}
document.addEventListener('pointerup',finishDrag);document.addEventListener('pointercancel',finishDrag);
document.addEventListener('keydown',e=>{const el=e.target.closest('[data-shape]');if(!el||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;const mode=el.dataset.mode,o=canvasData(mode).shapes.find(x=>x.id===el.dataset.shape),step=e.shiftKey?5:1;if(e.key==='ArrowLeft')o.x=Math.max(0,o.x-step);if(e.key==='ArrowRight')o.x=Math.min(100-o.w,o.x+step);if(e.key==='ArrowUp')o.y=Math.max(0,o.y-step);if(e.key==='ArrowDown')o.y=Math.min(100-o.h,o.y+step);e.preventDefault();selectShape(mode,o.id);$(`[data-shape="${o.id}"]`)?.focus();});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close();}});
render();
</script>
</body>
</html>
