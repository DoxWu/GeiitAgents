# ============================================
# GeiIt企业知识库 - CI/CD 流水线
# ============================================
# 作用：
#   在 PR 和 push 到 main 时自动运行后端测试、前端测试、
#   前端构建和 lint 检查，确保代码质量。
#
# E1-01: CI/CD 流水线搭建
# ============================================

name: CI

permissions:
  contents: read

# Frontend inference uses onnxruntime-web/WASM. Do not download Node CUDA EPs.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

on:
  push:
    branches: [main, develop, 'develop/**']
  pull_request:
    branches: [main, develop, 'develop/**']
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret and private artifact scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history and current diff
        uses: gitleaks/gitleaks-action@v2

  dependency-audit:
    name: Dependency audits and SBOMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kb_qa_system/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: kb_qa_system/frontend
        run: npm ci

      - name: Audit npm dependencies
        working-directory: kb_qa_system/frontend
        run: npm audit --registry=https://registry.npmjs.org --audit-level=low

      - name: Generate frontend production SBOM
        working-directory: kb_qa_system/frontend
        run: npm sbom --omit=dev --package-lock-only --sbom-format cyclonedx > "$RUNNER_TEMP/frontend-production.cdx.json"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test image vulnerability gate
        run: python -m unittest discover -s .github/scripts -p 'test_check_trivy_results.py'

      - name: Check Docker build context boundaries
        run: python .github/scripts/test_build_context_boundaries.py

      - name: Install Python dependency auditor
        run: python -m pip install --upgrade pip pip-audit httpx==0.28.1 packaging

      - name: Test Python SBOM enrichment
        run: python -m unittest discover -s .github/scripts -p 'test_enrich_python_sbom.py'

      - name: Audit Python runtime and optional local ML dependencies
        working-directory: kb_qa_system/backend
        run: >-
          pip-audit --strict --vulnerability-service osv
          --requirement requirements.txt
          --requirement requirements-local-ml.txt
          --requirement requirements-test.txt
          --format cyclonedx-json
          --output "$RUNNER_TEMP/python-dependencies.cdx.json"

      - name: Record Python package identities and publisher license declarations
        run: >-
          python .github/scripts/enrich_python_sbom.py
          --input "$RUNNER_TEMP/python-dependencies.cdx.json"
          --output "$RUNNER_TEMP/python-dependencies.cdx.json"
          --licenses "$RUNNER_TEMP/python-licenses.json"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust SBOM and audit tools
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.9
          cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Windows desktop dependencies
        run: >-
          cargo audit --target-os windows --target-arch x86_64
          --file kb_qa_system/frontend/src-tauri/Cargo.lock

      - name: Generate Rust SBOM and license inventory
        run: |
          cargo cyclonedx \
            --manifest-path kb_qa_system/frontend/src-tauri/Cargo.toml \
            --target x86_64-pc-windows-msvc \
            --format json \
            --spec-version 1.5 \
            --override-filename geiit-workbench-windows
          cp kb_qa_system/frontend/src-tauri/geiit-workbench-windows.json \
            "$RUNNER_TEMP/rust-dependencies.cdx.json"

      - name: Upload SBOM and license inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-sbom-and-licenses
          path: |
            ${{ runner.temp }}/frontend-production.cdx.json
            ${{ runner.temp }}/python-dependencies.cdx.json
            ${{ runner.temp }}/python-licenses.json
            ${{ runner.temp }}/rust-dependencies.cdx.json
          if-no-files-found: warn
          retention-days: 30

  # --------------------------------------------
  # 后端测试
  # --------------------------------------------
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kb_qa_system/backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ops_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops_test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            kb_qa_system/backend/requirements.txt
            kb_qa_system/backend/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client-16
          pg_dump --version
          pg_restore --version

      - name: Run tests
        env:
          # CI 使用 development 环境（config.py 仅允许 development/staging/production）
          # development 下 SECRET_KEY 校验宽松，适合 CI 场景
          ENVIRONMENT: development
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_URL: postgresql+psycopg://ops_test:test@localhost:5432/test
          GEIIT_OPS_TEST_ADMIN_URL: postgresql+psycopg://ops_test:test@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379/0
          GEIIT_WS_INTEGRATION: "1"
        run: |
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  langchain-contract-test:
    name: LangChain tool transcript contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kb_qa_system/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            kb_qa_system/backend/requirements.txt
            kb_qa_system/backend/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run contract test with real LangChain packages
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python -m pytest tests/test_office_tools_langchain.py -v --tb=short

  # --------------------------------------------
  # 前端测试
  # --------------------------------------------
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kb_qa_system/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kb_qa_system/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

  # --------------------------------------------
  # 前端生产构建
  # --------------------------------------------
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: kb_qa_system/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: kb_qa_system/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # --------------------------------------------
  # 生产容器构建门禁（只构建，不推送）
  # --------------------------------------------
  # 作用：在 CI 的 Docker daemon 中验证与部署使用相同的后端/前端 Dockerfile。
  # 镜像发布需要单独的凭据和目标仓库，不在通用 CI 中自动推送。
  container-build:
    name: Production Container Builds
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, dependency-audit]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ops_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops_test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        id: build-backend
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: kb_qa_system/backend
          file: kb_qa_system/backend/Dockerfile
          push: false
          load: true
          tags: geiit/backend:${{ github.sha }}
          build-args: |
            INSTALL_LOCAL_ML=false
            POSTGRES_CLIENT_MAJOR=16

      - name: Set up Python for image acceptance dependencies
        if: steps.build-backend.outcome == 'success'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare external test dependencies for the production image
        if: steps.build-backend.outcome == 'success'
        run: >-
          python -m pip install
          --target "$RUNNER_TEMP/image-test-deps"
          --requirement kb_qa_system/backend/requirements-test.txt

      - name: Restore with the production image's built-in PostgreSQL clients
        if: steps.build-backend.outcome == 'success'
        run: |
          docker run --rm --entrypoint python geiit/backend:${{ github.sha }} -c '
          import subprocess
          for tool in ("pg_dump", "pg_restore"):
              version = subprocess.check_output([tool, "--version"], text=True).strip()
              print(version)
              assert "(PostgreSQL) 16." in version, version
          '
          docker run --rm --network host --entrypoint python \
            -e ENVIRONMENT=development -e DEBUG=false \
            -e SECRET_KEY=ci-production-image-test-only \
            -e DATABASE_URL=postgresql+psycopg://ops_test:test@localhost:5432/test \
            -e GEIIT_OPS_TEST_ADMIN_URL=postgresql+psycopg://ops_test:test@localhost:5432/postgres \
            -e EMAIL_ENABLED=false -e LOCAL_EMBEDDING_ENABLED=false \
            -e PYTHONPATH=/test-deps:/app -e PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            --mount "type=bind,source=$RUNNER_TEMP/image-test-deps,target=/test-deps,readonly" \
            geiit/backend:${{ github.sha }} \
            -m pytest tests/test_ops.py tests/test_ops_alerts.py tests/test_maintenance.py \
            tests/test_recovery_bundle.py tests/test_vector_store_live_postgres.py \
            tests/test_embedding_migration.py \
            tests/test_entrypoint_supervision.py \
            -p pytest_asyncio.plugin --basetemp=/tmp/image-tests \
            -o cache_dir=/tmp/image-pytest-cache

      - name: Scan backend image for high and critical vulnerabilities
        id: scan-backend
        if: steps.build-backend.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: geiit/backend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: backend-trivy.json
          list-all-pkgs: true
          exit-code: "0"

      - name: Build frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: kb_qa_system/frontend
          file: kb_qa_system/frontend/Dockerfile
          push: false
          load: true
          tags: geiit/frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1

      - name: Scan frontend image for high and critical vulnerabilities
        id: scan-frontend
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: geiit/frontend:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: frontend-trivy.json
          list-all-pkgs: true
          exit-code: "0"

      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-image-vulnerability-reports
          path: |
            backend-trivy.json
            frontend-trivy.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce fixable high and critical vulnerability gate
        if: always()
        env:
          BACKEND_BUILD_OUTCOME: ${{ steps.build-backend.outcome }}
          BACKEND_SCAN_OUTCOME: ${{ steps.scan-backend.outcome }}
          FRONTEND_BUILD_OUTCOME: ${{ steps.build-frontend.outcome }}
          FRONTEND_SCAN_OUTCOME: ${{ steps.scan-frontend.outcome }}
        run: |
          for outcome in "$BACKEND_BUILD_OUTCOME" "$BACKEND_SCAN_OUTCOME" "$FRONTEND_BUILD_OUTCOME" "$FRONTEND_SCAN_OUTCOME"; do
            if [ "$outcome" != success ]; then
              echo "::error::An image build or scan did not succeed; inspect its step logs."
              exit 1
            fi
          done
          python .github/scripts/check_trivy_results.py backend-trivy.json frontend-trivy.json

      - name: Remove this run's test images
        if: always()
        env:
          BACKEND_TEST_IMAGE: geiit/backend:${{ github.sha }}
          FRONTEND_TEST_IMAGE: geiit/frontend:${{ github.sha }}
        run: |
          for image_ref in "$BACKEND_TEST_IMAGE" "$FRONTEND_TEST_IMAGE"; do
            if docker image inspect "$image_ref" > /dev/null 2>&1; then
              docker image rm "$image_ref"
            fi
          done
